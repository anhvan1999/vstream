name: VStream
options:
  bundleIdPrefix: com.vstream
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  VStreamKit:
    path: VStreamKit
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.8.0
targets:
  VStream:
    type: application
    platform: macOS
    sources:
      - path: VStream
    dependencies:
      - package: VStreamKit
        products: [AddonKit, StremioAPI, TraktKit, DebridKit, TorrentKit, PlayerKit, VStreamCore]
      - package: Nuke
        products: [Nuke, NukeUI]
    info:
      path: VStream/Info.plist
      properties:
        CFBundleDisplayName: VStream
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "GPL-3.0"
        CFBundleURLTypes:
          - CFBundleURLName: Stremio addon
            CFBundleURLSchemes: [stremio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: VStream/VStream.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vstream.app
        PRODUCT_NAME: VStream
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
        OTHER_LDFLAGS: ["-ObjC"]
schemes:
  VStream:
    build:
      targets:
        VStream: all
    run:
      config: Debug
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
    archive:
      config: Release
